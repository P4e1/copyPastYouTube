# Каркас. Одна команда деплоя (bash deploy.sh) оживает на шаге реализации:
# сборка образов приложения, миграции Alembic и scripts/seed.py здесь ещё не подключены.
# Сервисы спрятаны в профиль later, чтобы docker compose up не поднимал пустой стек.

name: copypast-youtube

services:
  postgres:
    profiles: ["later"]
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

  minio:
    profiles: ["later"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    profiles: ["later"]
    image: python:3.12-slim
    command: ["python", "-c", "print('api skeleton: приложение ещё не собрано')"]
    env_file: .env
    depends_on:
      - postgres
      - minio
    ports:
      - "8000:8000"

  worker:
    profiles: ["later"]
    image: python:3.12-slim
    command: ["python", "-c", "print('worker skeleton: очередь media_jobs ещё не обрабатывается')"]
    env_file: .env
    depends_on:
      - postgres
      - minio

  frontend:
    profiles: ["later"]
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
